apiVersion: v1
kind: Namespace
metadata:
  name: k8s-program

---

apiVersion: v1
kind: Service
metadata:
  name: resources-ms
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: resources-ms-pod
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

---

apiVersion: v1
kind: Service
metadata:
  name: songs-ms
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: songs-ms-pod
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-ms
  namespace: k8s-program
spec:
  selector:
    matchLabels:
      app: resources-ms-pod
  replicas: 2
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: resources-ms-pod
        owner: ievgengusar
    spec:
      containers:
        - name: resources-ms-container
          image: microservices-intro/resources-ms:2.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: resources-config
            - secretRef:
                name: db-credentials
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms
  namespace: k8s-program
spec:
  selector:
    matchLabels:
      app: songs-ms-pod
  replicas: 2
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: songs-ms-pod
        owner: ievgengusar
    spec:
      containers:
        - name: songs-ms-container
          image: microservices-intro/songs-ms:2.0.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: songs-config
            - secretRef:
                name: db-credentials
          volumeMounts:
            - name: songs-storage
              mountPath: /data
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-pvc

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: songs-pvc
  namespace: k8s-program
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
