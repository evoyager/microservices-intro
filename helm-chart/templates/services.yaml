apiVersion: v1
kind: Service
metadata:
  name: resources-ms
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  selector:
    app: resources-ms-pod
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: songs-ms
  namespace: "{{ .Release.Namespace }}"
spec:
  type: ClusterIP
  selector:
    app: songs-ms-pod
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
