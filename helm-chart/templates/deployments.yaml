apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-ms
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "microservices-intro.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: resources-ms-pod
  replicas: {{ .Values.resourcesReplicaCount | int }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: resources-ms-pod
        owner: ievgengusar
    spec:
      containers:
        - name: resources-ms-container
          image: "{{ .Values.resourcesImage }}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: resources-config
            - secretRef:
                name: db-credentials
          env:
            - name: SPRING_LOGGING_LEVEL_ROOT
              value: "DEBUG"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://resources-db:5433/resources_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 300
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 150
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "microservices-intro.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: songs-ms-pod
  replicas: {{ .Values.songsReplicaCount | int }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: songs-ms-pod
        owner: ievgengusar
    spec:
      containers:
        - name: songs-ms-container
          image: "{{ .Values.songsImage }}"
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: songs-config
            - secretRef:
                name: db-credentials
          env:
            - name: SPRING_LOGGING_LEVEL_ROOT
              value: "DEBUG"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://songs-db:5432/songs_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
          volumeMounts:
            - name: songs-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 300
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 150
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-pvc
