                - "-c"
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -p $PGPORT"
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -p $PGPORT"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -p $PGPORT"
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: songs-init-sql
          configMap:
            name: songs-config
            items:
              - key: init-songs.sql
                path: init-songs.sql
  volumeClaimTemplates:
    - metadata:
        name: songs-db-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ .Values.storageClass }}"
        resources:
          requests:
            storage: "{{ .Values.storageSize }}"
