# Kubernetes Secret to store Postgres credentials
# Use stringData so you can put plain text values (they'll be stored as base64 in the cluster)
# Reference this secret from Deployments using envFrom: or env:
#   envFrom:
#     - secretRef:
#         name: db-credentials

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: k8s-program
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
