apiVersion: v1
kind: Service
metadata:
  name: resources-ms
  namespace: "{{ .Values.namespace }}"
spec:
  type: NodePort
  selector:
    app: resources-ms-pod
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
{{- if gt (int .Values.nodePortResources) 0 }}
      nodePort: {{ .Values.nodePortResources | int }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: songs-ms
  namespace: "{{ .Values.namespace }}"
spec:
  type: NodePort
  selector:
    app: songs-ms-pod
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
{{- if gt (int .Values.nodePortSongs) 0 }}
      nodePort: {{ .Values.nodePortSongs | int }}
{{- end }}
