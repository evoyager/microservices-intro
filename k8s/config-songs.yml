apiVersion: v1
kind: ConfigMap
metadata:
  name: songs-config
  namespace: k8s-program
data:
  # Application identity & server config
  SONGS_MS_NAME: "songs-ms"
  SONGS_MS_PORT: "8081"

  # Database connection (non-sensitive parts)
  SONGS_DB_URL: "songs-db"
  SONGS_DB_PORT: "5432"

  # Service discovery / other services
  ENABLE_EUREKA_CLIENT: "false"
  EUREKA_URI: "eureka"

  # Ensure Hibernate uses 'update' to avoid recreate/drop on restarts
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

  init-songs.sql: |-
    -- SQL init script for songs database (can be mounted into /docker-entrypoint-initdb.d/)
    CREATE TABLE IF NOT EXISTS songs (
        id SERIAL PRIMARY KEY,
        name TEXT,
        artist TEXT,
        album TEXT,
        length TEXT,
        resource_id INTEGER UNIQUE NOT NULL,
        year TEXT
    );